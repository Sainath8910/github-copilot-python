<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sudoku</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/main.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Number logic</p>
        <h1>Sudoku</h1>
      </div>
      <button id="theme-toggle" class="button button--quiet" type="button" aria-pressed="false">
        Dark mode: Off
      </button>
    </header>

    <section class="game-toolbar" aria-label="Puzzle controls">
      <div class="difficulty-control">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <button id="new-game" class="button button--primary" type="button">New Game</button>
    </section>

    <p id="game-status" class="game-status" role="status" aria-live="polite" aria-atomic="true">
      Choose a difficulty and start a puzzle.
    </p>

    <div class="game-layout">
      <section class="board-panel" aria-labelledby="board-title">
        <div class="board-heading">
          <h2 id="board-title">Puzzle</h2>
          <div class="game-metrics" aria-label="Game status">
            <span class="metric-label">Time</span>
            <output id="timer" role="timer" aria-label="Elapsed time" aria-live="off">00:00</output>
            <span class="metric-divider" aria-hidden="true"></span>
            <span class="metric-label">Hints</span>
            <output id="hint-count" aria-label="Hints used">0</output>
          </div>
        </div>

        <div id="sudoku-board" class="sudoku-grid" role="group" aria-label="Sudoku puzzle board"></div>

        <div class="board-actions">
          <button id="hint-button" class="button button--quiet" type="button" aria-label="Use a hint to fill and lock one cell" disabled>Hint</button>
          <button id="check-puzzle" class="button button--primary" type="button">Check Puzzle</button>
        </div>
      </section>

      <aside class="support-panel" aria-label="Game information">
        <section class="leaderboard" aria-labelledby="leaderboard-title">
          <div class="section-heading">
            <h2 id="leaderboard-title">Top 10</h2>
            <span class="section-kicker">Best times</span>
          </div>
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th scope="col">Rank</th>
                <th scope="col">Player</th>
                <th scope="col">Time</th>
                <th scope="col">Difficulty</th>
                <th scope="col">Hints</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body" aria-live="polite">
              <tr><td class="empty-state" colspan="5">No completed games yet.</td></tr>
            </tbody>
          </table>
        </section>

        <dialog id="completion-dialog" class="completion-dialog" aria-labelledby="completion-title" aria-describedby="completion-summary">
          <h2 id="completion-title">Puzzle complete</h2>
          <p id="completion-summary"></p>
          <form id="completion-form" class="completion-form">
            <label for="player-name">Your name</label>
            <input id="player-name" name="player-name" type="text" autocomplete="name" maxlength="40" required>
            <button class="button button--primary" type="submit">Continue</button>
          </form>
        </dialog>
      </aside>
    </div>
  </main>
</body>
</html>
